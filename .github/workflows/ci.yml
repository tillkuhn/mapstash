name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # https://github.blog/changelog/2025-01-16-linux-arm64-hosted-runners-now-available-for-free-in-public-repositories-public-preview/
    runs-on: ubuntu-24.04-arm #ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mapstash_test
          POSTGRES_USER: mapstash
          POSTGRES_PASSWORD: mapstash
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        uname -a
        mvn -B clean package --file pom.xml
      env:
        DATABASE_URL: jdbc:postgresql://localhost:5432/mapstash_test
        DATABASE_USER: mapstash
        DATABASE_PASSWORD: mapstash
        MAPBOX_TOKEN: pk.test-token-for-ci

    - name: Run tests
      run: mvn test
      env:
        DATABASE_URL: jdbc:postgresql://localhost:5432/mapstash_test
        DATABASE_USER: mapstash
        DATABASE_PASSWORD: mapstash
        MAPBOX_TOKEN: pk.test-token-for-ci

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
