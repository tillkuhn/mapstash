# PROD Configuration. VERSION CONTROLLED!!!
server.port=2012
logging.level.com.mapstash=INFO

# ----------------------
# Production tuning notes
# ----------------------
# The lines below are examples and suggestions. Keep them commented and enable only the
# properties you actually intend to use in production. Replace placeholders (e.g. ${DB_URL})
# with environment variables or an external secret manager - do NOT store secrets in VCS.

# Graceful shutdown
# server.shutdown=graceful
# spring.lifecycle.timeout-per-shutdown-phase=30s

# HTTP compression and size thresholds
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# HTTP/2 (note: typically requires TLS termination for browsers)
# server.http2.enabled=true

# Tomcat (if you use Tomcat) - adjust for your CPU / expected concurrency
# server.tomcat.max-threads=200
# server.tomcat.accept-count=100
# server.tomcat.connection-timeout=20000
# server.tomcat.max-connections=10000

# Undertow example (if you use Undertow)
# server.undertow.threads.io=8
# server.undertow.worker-threads=200

# Jetty example (if you use Jetty)
# server.jetty.acceptors=2
# server.jetty.selectors=4

# Datasource / HikariCP - tune pool size to your DB capacity and app concurrency
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.hikari.maximum-pool-size=30
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=300000
# spring.datasource.hikari.max-lifetime=1800000
# spring.datasource.hikari.leak-detection-threshold=2000
# spring.datasource.hikari.auto-commit=false

# JPA / Hibernate
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# spring.jpa.properties.hibernate.generate_statistics=false

# Caching (example using caffeine) - enable a cache for expensive reads
# spring.cache.type=caffeine
# spring.cache.caffeine.spec=maximumSize=10000,expireAfterAccess=10m

# Actuator / metrics / health
# Expose only what you need; secure actuator endpoints with auth & network policies
# management.endpoints.web.exposure.include=health,info,prometheus
# management.endpoint.health.show-details=never
# management.server.port=2013
# management.metrics.export.prometheus.enabled=true

# Logging
# Use logback-spring.xml for structured logging and async appenders in production.
# Example settings below are lightweight; prefer a dedicated logging config file.
# logging.level.root=INFO
# logging.file.name=/var/log/mapstash/application.log
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n

# Security / secrets management
# Do NOT put secrets here. Prefer environment variables, Kubernetes Secrets, or Vault.
# Example of referencing env var: spring.datasource.password=${DB_PASSWORD:}

# Docker / Kubernetes & JVM tuning
# Do container-aware JVM tuning. Example JVM opts (set via container env/JAVA_TOOL_OPTIONS):
# -XX:+UseG1GC -XX:MaxRAMPercentage=75 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof
# -Dspring.profiles.active=prod -Djava.security.egd=file:/dev/./urandom
# For small containers consider setting -Xms and -Xmx explicitly, e.g. -Xms512m -Xmx512m

# Database migration strategy
# In production prefer to run Flyway/Liquibase migrations as part of deployment pipeline,
# not on application startup. If you must, use validate or baseline appropriately.
# spring.flyway.enabled=false

# Misc
# spring.main.lazy-initialization=false  # usually false in prod; can speed up first requests if true
spring.devtools.restart.enabled=false

# End of suggestions
