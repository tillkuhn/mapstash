# MapStash Application Configuration

# Server Configuration
spring.application.name=    mapstash
server.port=8080

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# MapStash Configuration
mapstash.upload.directory=uploads

# Mapbox Configuration
# IMPORTANT: Set your Mapbox token here or in application-local.properties
# Get your token from: https://account.mapbox.com/access-tokens/
mapstash.mapbox.token=${MAPBOX_TOKEN:your-mapbox-token-here}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mapstash_db}
spring.datasource.username=${DATABASE_USER:mapstash}
spring.datasource.password=${DATABASE_PASSWORD:mapstash}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.mapstash=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
